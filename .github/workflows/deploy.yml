name: Deploy Next.js to Lightsail

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & Build (Runner Check)
        # We pass env here so the build doesn't fail on the GitHub runner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_AWS_S3_REGION: ${{ secrets.NEXT_PUBLIC_AWS_S3_REGION }}
          NEXT_PUBLIC_AWS_S3_ACCESS_KEY_ID: ${{ secrets.NEXT_PUBLIC_AWS_S3_ACCESS_KEY_ID }}
          NEXT_PUBLIC_AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_AWS_S3_SECRET_ACCESS_KEY }}
          NEXT_PUBLIC_AWS_S3_BUCKET_NAME: ${{ secrets.NEXT_PUBLIC_AWS_S3_BUCKET_NAME }}
          NEXT_PUBLIC_CLOUDFRONT_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFRONT_URL }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        run: |
          npm install --legacy-peer-deps
          npx prisma generate
          npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            # Set the APP_DIR secret to the checkout path on the server. The
            # fallback matches the root the nginx config serves .next from.
            cd "${{ secrets.APP_DIR || '/var/www/html' }}"
            git pull origin main

            # 1. Create/Overwrite the .env file on the server
            echo "DATABASE_URL=\"${{ secrets.DATABASE_URL }}\"" > .env
            echo "NEXTAUTH_URL=\"${{ secrets.NEXTAUTH_URL }}\"" >> .env
            echo "NEXTAUTH_SECRET=\"${{ secrets.NEXTAUTH_SECRET }}\"" >> .env
            echo "UPLOAD_DIR=\"./uploads\"" >> .env
            echo "MAX_FILE_SIZE_MB=\"50\"" >> .env
            echo "NEXT_PUBLIC_AWS_S3_REGION=\"${{ secrets.NEXT_PUBLIC_AWS_S3_REGION }}\"" >> .env
            echo "NEXT_PUBLIC_AWS_S3_ACCESS_KEY_ID=\"${{ secrets.NEXT_PUBLIC_AWS_S3_ACCESS_KEY_ID }}\"" >> .env
            echo "NEXT_PUBLIC_AWS_S3_SECRET_ACCESS_KEY=\"${{ secrets.NEXT_PUBLIC_AWS_S3_SECRET_ACCESS_KEY }}\"" >> .env
            echo "NEXT_PUBLIC_AWS_S3_BUCKET_NAME=\"${{ secrets.NEXT_PUBLIC_AWS_S3_BUCKET_NAME }}\"" >> .env
            echo "NEXT_PUBLIC_CLOUDFRONT_URL=\"${{ secrets.NEXT_PUBLIC_CLOUDFRONT_URL }}\"" >> .env
            echo "RAZORPAY_KEY_ID=\"${{ secrets.RAZORPAY_KEY_ID }}\"" >> .env
            echo "RAZORPAY_KEY_SECRET=\"${{ secrets.RAZORPAY_KEY_SECRET }}\"" >> .env

            # 2. Install, apply schema changes, then build
            npm install --legacy-peer-deps
            npx prisma generate
            # Without this the committed migrations never reach the database.
            npx prisma migrate deploy

            # A partially written .next makes `next start` 404 every dynamic
            # route, so build into a clean directory and fail the deploy if the
            # build did not complete.
            rm -rf .next
            npm run build
            test -f .next/BUILD_ID

            pm2 restart all --update-env || pm2 start npm --name "next-app" -- start

            # 3. Smoke-check that the server came back up
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:3000/api/health > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed after restart" >&2
            pm2 logs --nostream --lines 50 || true
            exit 1
